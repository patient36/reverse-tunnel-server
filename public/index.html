<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tunnel Manager</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto;
background:#0f172a;
display:flex;
justify-content:center;
padding:40px;
}

.app{
width:100%;
max-width:1000px;
background:white;
border-radius:12px;
padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.header h1{
font-size:22px;
font-weight:600;
}

/* INPUT */

.input-group{
display:flex;
gap:10px;
margin-bottom:20px;
}

input{
flex:1;
padding:12px 14px;
border-radius:8px;
border:1px solid #e2e8f0;
font-size:14px;
}

input:focus{
outline:none;
border-color:#6366f1;
box-shadow:0 0 0 3px rgba(99,102,241,.15);
}

/* BUTTONS */

button{
border:none;
border-radius:8px;
padding:10px 14px;
font-size:13px;
cursor:pointer;
transition:.15s;
font-weight:500;
}

.primary{
background:#6366f1;
color:white;
}

.primary:hover{background:#4f46e5}

.edit-btn{
background:#f59e0b;
color:white;
}

.delete-btn{
background:#ef4444;
color:white;
}

.action-btn{
padding:6px 10px;
font-size:12px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

thead{background:#f8fafc}

th,td{
padding:12px;
text-align:left;
border-bottom:1px solid #f1f5f9;
}

tbody tr:hover{background:#f9fafb}

/* URL */

.public-url{
color:#6366f1;
text-decoration:none;
font-weight:500;
}

.public-url:hover{text-decoration:underline}

.action-btns{
display:flex;
gap:6px;
}

/* PAGINATION */

.pagination{
margin-top:20px;
display:flex;
justify-content:center;
gap:6px;
}

.pagination button{
background:#f1f5f9;
}

.pagination button.active{
background:#6366f1;
color:white;
}

/* TOAST */

.toast-container{
position:fixed;
bottom:20px;
right:20px;
display:flex;
flex-direction:column;
gap:8px;
}

.toast{
background:#111827;
color:white;
padding:12px 18px;
border-radius:8px;
font-size:13px;
opacity:0;
transform:translateY(10px);
transition:.25s;
}

.toast.show{
opacity:.95;
transform:translateY(0);
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
align-items:center;
justify-content:center;
}

.modal-box{
background:white;
border-radius:10px;
padding:25px;
width:340px;
box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.modal-title{
font-size:16px;
font-weight:600;
margin-bottom:10px;
}

.modal-body{
margin-bottom:18px;
font-size:14px;
}

.modal-body input{
width:100%;
}

.modal-actions{
display:flex;
justify-content:flex-end;
gap:10px;
}

.cancel{
background:#e5e7eb;
}

</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>Tunnel Manager</h1>
</div>

<div class="input-group">
<input id="target" placeholder="http://localhost:4000/webhook">
<button class="primary" onclick="createTunnel()">Create Tunnel</button>
</div>

<table>

<thead>
<tr>
<th>ID</th>
<th>Local Target</th>
<th>Public URL</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="tunnelsTable"></tbody>

</table>

<div class="pagination" id="pagination"></div>

</div>

<div class="toast-container"></div>

<!-- REUSABLE MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-title" id="modal-title"></div>

<div class="modal-body" id="modal-body"></div>

<div class="modal-actions">

<button class="cancel" onclick="closeModal()">Cancel</button>

<button class="primary" id="modal-confirm"></button>

</div>

</div>

</div>

<script>

const toastContainer=document.querySelector('.toast-container')

const modal=document.getElementById('modal')
const modalTitle=document.getElementById('modal-title')
const modalBody=document.getElementById('modal-body')
const modalConfirm=document.getElementById('modal-confirm')

let modalCallback=null

let tunnelsData={}
let currentPage=1
const pageSize=10

function showToast(msg,duration=2500){

const toast=document.createElement('div')
toast.className='toast show'
toast.textContent=msg

toastContainer.appendChild(toast)

setTimeout(()=>{
toast.classList.remove('show')
setTimeout(()=>toast.remove(),300)
},duration)

}

/* MODAL */

function openModal({title,body,confirmText,onConfirm}){

modalTitle.textContent=title
modalBody.innerHTML=body
modalConfirm.textContent=confirmText

modal.style.display='flex'

modalCallback=onConfirm

}

function closeModal(){
modal.style.display='none'
modalCallback=null
}

modalConfirm.onclick=()=>{
if(modalCallback) modalCallback()
closeModal()
}

/* DATA */

async function fetchTunnels(){

const res=await fetch('/tunnels')
tunnelsData=await res.json()

currentPage=1

renderTable()

}

function renderTable(){

const tbody=document.getElementById('tunnelsTable')
tbody.innerHTML=''

const ids=Object.keys(tunnelsData)

const totalPages=Math.ceil(ids.length/pageSize)

const start=(currentPage-1)*pageSize
const end=start+pageSize

ids.slice(start,end).forEach(id=>{

const t=tunnelsData[id]

const tr=document.createElement('tr')

tr.innerHTML=`
<td>${id}</td>
<td>${t.target}</td>
<td>
<a class="public-url" target="_blank" href="/tunnel/${id}">
/tunnel/${id}
</a>
</td>
<td>
<div class="action-btns">
<button class="action-btn edit-btn" onclick="editTunnel('${id}')">Edit</button>
<button class="action-btn delete-btn" onclick="deleteTunnel('${id}')">Delete</button>
</div>
</td>
`

tbody.appendChild(tr)

})

renderPagination(totalPages)

}

function renderPagination(total){

const el=document.getElementById('pagination')
el.innerHTML=''

for(let i=1;i<=total;i++){

const b=document.createElement('button')

b.textContent=i

if(i===currentPage) b.classList.add('active')

b.onclick=()=>{
currentPage=i
renderTable()
}

el.appendChild(b)

}

}

/* CREATE */

async function createTunnel(){

const input=document.getElementById('target')
const target=input.value.trim()

if(!target) return showToast('Enter local URL')

try{

const res=await fetch('/register',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({target})
})

const data=await res.json()

showToast(data.message)

input.value=''   // CLEAR INPUT

fetchTunnels()

}catch{

showToast('Create failed')

}

}

/* EDIT */

function editTunnel(id){

const current=tunnelsData[id].target

openModal({

title:'Edit Tunnel',

body:`<input id="edit-input" value="${current}">`,

confirmText:'Save',

onConfirm: async()=>{

const newTarget=document.getElementById('edit-input').value.trim()

if(!newTarget) return

try{

const res=await fetch(`/tunnels/${id}`,{
method:'PUT',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({target:newTarget})
})

const data=await res.json()

showToast(data.message)

document.getElementById('target').value=''  // reset main input

fetchTunnels()

}catch{

showToast('Edit failed')

}

}

})

}

/* DELETE */

function deleteTunnel(id){

openModal({

title:'Delete Tunnel',

body:`Are you sure you want to delete this tunnel?`,

confirmText:'Delete',

onConfirm: async()=>{

try{

const res=await fetch(`/tunnels/${id}`,{method:'DELETE'})

const data=await res.json()

showToast(data.message)

fetchTunnels()

}catch{

showToast('Delete failed')

}

}

})

}

fetchTunnels()

</script>

</body>
</html>
